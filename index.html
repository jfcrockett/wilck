<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wilck">
<meta name="theme-color" content="#14213d">
<title>Wilck</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎢</text></svg>">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14213d;--mute:#5b6577;--line:#e1e4ea;--brand:#14213d;--accent:#fca311;
  --vg:#0a7d3c;--g:#3c8f2f;--avg:#6b7280;--busy:#c2610c;--vb:#b42318;--ll:#6d28d9}
@media (prefers-color-scheme:dark){:root{--bg:#0d1321;--card:#18203a;--ink:#f1f3f8;--mute:#a3acc0;--line:#2a3352;--brand:#0d1321;
  --vg:#4ade80;--g:#86d96b;--avg:#a3acc0;--busy:#fb923c;--vb:#f87171;--ll:#c4b5fd}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.top{display:flex;align-items:center;gap:10px}
h1{font-size:20px;margin:0;letter-spacing:.3px}
#stamp{flex:1;font-size:13px;opacity:.8;text-align:right}
button{font:inherit;color:inherit;border:0;border-radius:10px;padding:10px 12px;background:var(--line);cursor:pointer;min-height:40px}
header button{background:rgba(255,255,255,.14);color:#fff}
#geo{display:block;width:100%;text-align:left;margin-top:8px;font-size:14px}
nav{display:flex;margin-top:8px}
nav button{flex:1;background:none;border-radius:0;border-bottom:3px solid transparent;opacity:.7;font-weight:600}
nav button[aria-selected=true]{border-color:var(--accent);opacity:1}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 40px);max-width:640px;margin:0 auto}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chips button{flex:1;font-size:14px;padding:8px 6px;background:var(--card);border:1px solid var(--line)}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);margin:18px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.hero{border:2px solid var(--accent)}
.hero .name{font-size:20px}
.ll{border-color:var(--ll)}
.ride{display:flex;gap:12px;align-items:flex-start}
.main{flex:1;min-width:0}
.name{font-weight:650}
.park{font-size:11px;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.meta{font-size:14px;color:var(--mute);margin-top:3px}
.meta div{margin-top:2px}
.tag{font-weight:700}
.vg{color:var(--vg)}.g{color:var(--g)}.avg{color:var(--avg)}.busy{color:var(--busy)}.vb{color:var(--vb)}.llc{color:var(--ll);font-weight:650}
.wait{text-align:center;min-width:54px}
.wait b{display:block;font-size:28px;line-height:1}
.wait span{font-size:12px;color:var(--mute)}
.wait.off{font-size:13px;color:var(--mute);padding-top:4px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts button{font-size:14px;padding:8px 12px}
.acts .llb{background:var(--ll);color:#fff}
@media (prefers-color-scheme:dark){.acts .llb{color:#0d1321}}
.note{color:var(--mute);font-size:14px;padding:6px 4px}
.warn{background:#fff4d6;color:#6b4a00;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.done .name{text-decoration:line-through;color:var(--mute);font-weight:500}
#q{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:8px}
label.pick{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
label.pick input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
label.pick span{flex:1}
label.pick small{color:var(--mute);white-space:nowrap}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="top"><h1>🎢 Wilck</h1><div id="stamp"></div><button id="refresh" aria-label="Refresh">↻</button></div>
  <button id="geo"></button>
  <nav><button id="t-now"></button><button id="t-pick"></button></nav>
</header>
<main>
  <section id="now"></section>
  <section id="pick" hidden>
    <input id="q" type="search" placeholder="Search rides" autocomplete="off">
    <div id="picklist"></div>
  </section>
</main>
<script>
// Wilck: pick your rides, see the best one to do right now. Static page, no login, no server.
// Wait times, Lightning Lane return times, forecasts and ride locations all come from themeparks.wiki.
const API = 'https://api.themeparks.wiki/v1/entity/bfc89fd6-314d-44b4-b89e-df1a89cf991e'; // Disneyland Resort
const PARKS = {'7340550b-c14d-4def-80bb-acdb51d49a66': ['Disneyland', 'DL'], '832fcd51-ea19-4e77-85c7-75d5843b127c': ['California Adventure', 'DCA']};
const CENTER = {lat: 33.809, lng: -117.919}, TZ = 'America/Los_Angeles';
const $ = s => document.querySelector(s);

const store = {
  get(k, d) { try { const v = localStorage.getItem('wilck.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('wilck.' + k, JSON.stringify(v)); } catch {} },
};
const parkDay = () => new Date().toLocaleDateString('en-CA', {timeZone: TZ});
const clock = t => new Date(t).toLocaleTimeString('en-US', {timeZone: TZ, hour: 'numeric', minute: '2-digit'});
const hour = t => new Date(t).toLocaleTimeString('en-US', {timeZone: TZ, hour: 'numeric'});

let sel = new Set(store.get('sel', []));
let park = store.get('park', 'all');
let tab = sel.size ? 'now' : 'pick';
let day = store.get('day', null);           // "rode it" and booked Lightning Lanes, reset each park day
let cache = store.get('live', {t: 0, live: []});
let live = cache.live, fetchedAt = cache.t, failed = false;
let places = store.get('places', {});       // ride id -> {lat,lng}
let pos = null, geoState = 'off';           // off | wait | on | denied | error

function freshDay() {
  if (!day || day.date !== parkDay()) day = {date: parkDay(), done: [], ll: {}};
}
const saveDay = () => store.set('day', day);

// ---- scoring (pure) ----
// ponytail: "bang for buck" = (wait + walk) against what this ride usually costs the rest of today.
// Thresholds are the old Wilck ones (70/90/110/130% of average). Tune here if the ranking feels off.
function score(wait, walk, typical) {
  if (wait == null) return Infinity;
  return (wait + (walk || 0) + 5) / ((typical ?? wait) + 5);
}
function label(wait, typical) {
  if (wait == null) return null;
  if (wait <= 10) return ['Walk-on', 'vg'];
  if (!typical) return null;
  const r = wait / typical;
  return r <= .7 ? ['Great time', 'vg'] : r <= .9 ? ['Good time', 'g'] : r <= 1.1 ? ['Typical', 'avg'] : r <= 1.3 ? ['Busy', 'busy'] : ['Very busy', 'vb'];
}
function meters(a, b) {
  const R = 6371000, rad = Math.PI / 180, dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
// ponytail: straight line x1.4 at a slow crowd pace (70 m/min). No path map; add one if walk times mislead.
const walkMin = (a, b) => Math.max(1, Math.round(meters(a, b) * 1.4 / 70));

function analyze(a, now, here) {
  const q = a.queue || {}, p = places[a.id];
  const wait = a.status === 'OPERATING' ? (q.STANDBY?.waitTime ?? null) : null;
  const fc = (a.forecast || []).filter(f => f.waitTime > 0).map(f => ({t: Date.parse(f.time), w: f.waitTime}));
  const rest = fc.filter(f => f.t >= now - 36e5), pool = rest.length ? rest : fc;
  const typical = pool.length ? Math.round(pool.reduce((s, f) => s + f.w, 0) / pool.length) : null;
  const future = fc.filter(f => f.t > now);
  let trend = null;
  if (wait != null && future.length) {
    const lo = future.reduce((m, f) => f.w < m.w ? f : m);
    if (lo.w <= wait - 10) trend = `Should drop to ~${lo.w} min around ${hour(lo.t)}`;
    else if (wait > 10 && future.every(f => f.w >= wait + 5)) trend = 'Only gets longer from here';
  }
  const walk = here && p ? walkMin(here, p) : null;
  const ll = q.RETURN_TIME, llOpen = ll?.state === 'AVAILABLE' && ll.returnStart ? Date.parse(ll.returnStart) : null;
  let saves = wait || 0;
  if (llOpen && fc.length) saves = Math.max(saves, fc.reduce((m, f) => Math.abs(f.t - llOpen) < Math.abs(m.t - llOpen) ? f : m).w);
  return {id: a.id, name: a.name, parkId: a.parkId, status: a.status, wait, typical, trend, walk,
    score: score(wait, walk, typical), tag: label(wait, typical), ll, llOpen, saves,
    llScore: llOpen ? saves - 5 * Math.max(0, (llOpen - now) / 36e5) : -Infinity,
    paid: q.PAID_RETURN_TIME, single: q.SINGLE_RIDER?.waitTime ?? null};
}

// ---- data ----
async function load() {
  if (!Object.keys(places).length || Date.now() - store.get('placesAt', 0) > 7 * 864e5) {
    try {
      const j = await (await fetch(API + '/children')).json();
      places = {};
      for (const c of j.children) if (c.location?.latitude) places[c.id] = {lat: c.location.latitude, lng: c.location.longitude};
      store.set('places', places); store.set('placesAt', Date.now());
    } catch {}
  }
  try {
    const r = await fetch(API + '/live', {cache: 'no-store'});
    if (!r.ok) throw 0;
    live = (await r.json()).liveData.filter(x => x.entityType === 'ATTRACTION' && PARKS[x.parkId]);
    fetchedAt = Date.now(); failed = false;
    store.set('live', {t: fetchedAt, live});
  } catch { failed = true; }
  render();
}

// ---- location ----
function startGeo() {
  if (!navigator.geolocation) { geoState = 'error'; return render(); }
  geoState = 'wait'; render();
  navigator.geolocation.watchPosition(p => {
    const next = {lat: p.coords.latitude, lng: p.coords.longitude};
    const moved = !pos || meters(pos, next) > 25;
    geoState = 'on'; store.set('geo', 1);
    if (moved) { pos = next; render(); }
  }, e => {
    geoState = e.code === 1 ? 'denied' : 'error';
    if (e.code === 1) store.set('geo', 0);
    pos = null; render();
  }, {enableHighAccuracy: true, maximumAge: 15000, timeout: 20000});
}
const atPark = () => pos && meters(pos, CENTER) < 2500;

// ---- view ----
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in props || {}) {
    const v = props[k];
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v != null && v !== false) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(3)) if (c != null && c !== false) e.append(c);
  return e;
}
const nameEl = r => h('div', {class: 'name'}, r.name, h('span', {class: 'park'}, PARKS[r.parkId][1]));
const OFF = {CLOSED: 'Closed', DOWN: 'Down right now', REFURBISHMENT: 'Refurb'};

function waitEl(r) {
  if (r.status !== 'OPERATING') return h('div', {class: 'wait off'}, OFF[r.status] || r.status);
  if (r.wait == null) return h('div', {class: 'wait off'}, 'Open');
  return h('div', {class: 'wait ' + (r.tag ? r.tag[1] : '')}, h('b', null, r.wait), h('span', null, 'min'));
}
function metaEl(r, now) {
  const first = [];
  if (r.tag) first.push(h('span', {class: 'tag ' + r.tag[1]}, r.tag[0]));
  if (r.walk != null) first.push(`🚶 ${r.walk} min walk`);
  if (r.typical != null && r.wait != null) first.push(`usually ~${r.typical}`);
  const lines = [];
  if (first.length) lines.push(h('div', null, first.flatMap((x, i) => i ? [' · ', x] : [x])));
  if (r.trend) lines.push(h('div', null, r.trend));
  if (r.llOpen) lines.push(h('div', {class: 'llc'}, `⚡ Lightning Lane return ${clock(r.llOpen)}`));
  else if (r.ll?.state === 'FINISHED' && r.status === 'OPERATING') lines.push(h('div', null, '⚡ Lightning Lane gone for today'));
  if (r.paid?.state === 'AVAILABLE' && r.paid.returnStart)
    lines.push(h('div', null, `Paid Lightning Lane ${r.paid.price?.formatted || ''} at ${clock(Date.parse(r.paid.returnStart))}`));
  if (r.single != null) lines.push(h('div', null, `Single rider: ${r.single} min`));
  return h('div', {class: 'meta'}, lines);
}
function act(text, fn, cls) { return h('button', {class: cls, onclick: fn}, text); }
const rode = id => () => { day.done.push(id); delete day.ll[id]; saveDay(); render(); };
const unrode = id => () => { day.done = day.done.filter(x => x !== id); saveDay(); render(); };
const book = r => () => { day.ll[r.id] = {start: r.llOpen, end: r.ll.returnEnd ? Date.parse(r.ll.returnEnd) : r.llOpen + 36e5}; saveDay(); render(); };
const unbook = id => () => { delete day.ll[id]; saveDay(); render(); };

function rideCard(r, now, cls, buttons) {
  return h('div', {class: 'card ' + (cls || '')},
    h('div', {class: 'ride'}, h('div', {class: 'main'}, nameEl(r), metaEl(r, now)), waitEl(r)),
    buttons && h('div', {class: 'acts'}, buttons));
}

function renderNow() {
  const now = Date.now(), out = [];
  if (failed) out.push(h('div', {class: 'warn'}, fetchedAt
    ? `Couldn't refresh. Showing wait times from ${clock(fetchedAt)}.` : `Couldn't load wait times. Check your signal and tap ↻.`));
  else if (fetchedAt && now - fetchedAt > 15 * 6e4) out.push(h('div', {class: 'warn'}, `These wait times are from ${clock(fetchedAt)}. Tap ↻.`));
  if (!live.length) { out.push(h('div', {class: 'note'}, failed ? '' : 'Loading wait times…')); return $('#now').replaceChildren(...out); }
  if (!sel.size) {
    out.push(h('div', {class: 'card'}, h('div', {class: 'name'}, 'Pick the rides you want today'),
      h('div', {class: 'meta'}, 'Then this screen ranks them by the best use of your time right now.'),
      h('div', {class: 'acts'}, act('Pick rides', () => { tab = 'pick'; render(); }))));
    return $('#now').replaceChildren(...out);
  }
  out.push(h('div', {class: 'chips'}, [['all', 'Both parks'], ...Object.entries(PARKS).map(([id, n]) => [id, n[0]])].map(([id, n]) =>
    h('button', {'aria-pressed': String(park === id), onclick: () => { park = id; store.set('park', id); render(); }}, n))));

  const here = atPark() ? pos : null;
  const rows = live.filter(a => sel.has(a.id) && (park === 'all' || a.parkId === park)).map(a => analyze(a, now, here));
  const done = rows.filter(r => day.done.includes(r.id));
  const booked = rows.filter(r => !day.done.includes(r.id) && day.ll[r.id]).sort((a, b) => day.ll[a.id].start - day.ll[b.id].start);
  const active = rows.filter(r => !day.done.includes(r.id) && !day.ll[r.id]);
  const open = active.filter(r => r.status === 'OPERATING').sort((a, b) => a.score - b.score || a.wait - b.wait);
  const shut = active.filter(r => r.status !== 'OPERATING');
  // A Lightning Lane is only worth spending on a ride that would cost 15+ min of standby.
  const llPicks = open.filter(r => r.llOpen && r.saves >= 15).sort((a, b) => b.llScore - a.llScore);

  if (open.length && open[0].wait != null) {
    const best = open.shift();
    out.push(h('h2', null, 'Best right now'), rideCard(best, now, 'hero', act('✓ Rode it', rode(best.id))));
  } else if (!booked.length && !done.length && !shut.length) {
    out.push(h('div', {class: 'note'}, 'None of your picks are in this park.'));
  } else if (!open.length && shut.length) {
    out.push(h('div', {class: 'note'}, 'None of your remaining picks are running right now.'));
  }

  if (booked.length || llPicks.length) {
    out.push(h('h2', null, '⚡ Lightning Lane'));
    for (const r of booked) {
      const w = day.ll[r.id];
      const msg = now < w.start ? `Return ${clock(w.start)} to ${clock(w.end)} (in ${Math.round((w.start - now) / 6e4)} min)`
        : now <= w.end ? `Return window is open until ${clock(w.end)}. Go!` : `Window ended ${clock(w.end)}. Check the Disneyland app.`;
      out.push(h('div', {class: 'card ll'}, nameEl(r),
        h('div', {class: 'meta'}, h('div', {class: 'llc'}, 'Booked · ' + msg),
          r.status !== 'OPERATING' && h('div', null, OFF[r.status] || r.status), r.walk != null && h('div', null, `🚶 ${r.walk} min walk`)),
        h('div', {class: 'acts'}, act('✓ Rode it', rode(r.id)), act('Not booked', unbook(r.id)))));
    }
    llPicks.slice(0, 3).forEach((r, i) => out.push(h('div', {class: 'card ll'}, nameEl(r),
      h('div', {class: 'meta'}, h('div', {class: 'llc'}, `${i ? 'Or' : 'Book next'}: return ${clock(r.llOpen)}`),
        h('div', null, `Skips about ${r.saves} min of standby` + (r.wait != null ? ` (${r.wait} min now)` : ''))),
      h('div', {class: 'acts'}, act('⚡ I booked this', book(r), 'llb')))));
    if (llPicks.length) out.push(h('div', {class: 'note'}, 'Book in the Disneyland app, then tap “I booked this” so it leaves the standby list.'));
  }

  if (open.length) { out.push(h('h2', null, 'Then')); for (const r of open) out.push(rideCard(r, now, '', act('✓ Rode it', rode(r.id)))); }
  if (shut.length) { out.push(h('h2', null, 'Not running')); for (const r of shut) out.push(rideCard(r, now, '', act('✓ Rode it', rode(r.id)))); }
  if (done.length) {
    out.push(h('h2', null, `Done today (${done.length})`));
    for (const r of done) out.push(h('div', {class: 'card done ride'}, h('div', {class: 'main'}, nameEl(r)), act('Undo', unrode(r.id))));
  }
  $('#now').replaceChildren(...out);
}

function renderPick() {
  const q = $('#q').value.trim().toLowerCase(), out = [];
  if (!live.length) return $('#picklist').replaceChildren(h('div', {class: 'note'}, failed ? `Couldn't load the ride list. Tap ↻.` : 'Loading rides…'));
  if (sel.size) out.push(h('div', {class: 'acts', style: 'margin:0 0 10px'},
    act(`Done picking (${sel.size})`, () => { tab = 'now'; render(); scrollTo(0, 0); }, 'llb'),
    act('Clear all', () => { if (confirm('Clear all your picks?')) { sel.clear(); store.set('sel', []); render(); } })));
  for (const [id, n] of Object.entries(PARKS)) {
    const list = live.filter(a => a.parkId === id && a.name.toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
    if (!list.length) continue;
    out.push(h('h2', null, n[0]));
    for (const a of list) {
      const w = a.status === 'OPERATING' ? (a.queue?.STANDBY?.waitTime != null ? a.queue.STANDBY.waitTime + ' min' : 'Open') : (OFF[a.status] || a.status);
      out.push(h('label', {class: 'pick'},
        h('input', {type: 'checkbox', checked: sel.has(a.id), onchange: e => {
          e.target.checked ? sel.add(a.id) : sel.delete(a.id); store.set('sel', [...sel]); tabs(); }}),
        h('span', null, a.name), h('small', null, w)));
    }
  }
  $('#picklist').replaceChildren(...out);
}

function tabs() {
  $('#t-now').textContent = 'Now';
  $('#t-pick').textContent = `My rides (${sel.size})`;
  $('#t-now').setAttribute('aria-selected', tab === 'now');
  $('#t-pick').setAttribute('aria-selected', tab === 'pick');
}
function stamp() { $('#stamp').textContent = fetchedAt ? 'Updated ' + clock(fetchedAt) : ''; }
function render() {
  freshDay(); tabs(); stamp();
  $('#geo').textContent = {
    off: '📍 Turn on location for walk times', wait: '📍 Finding you…',
    on: atPark() ? '📍 Location on · walk times included' : '📍 You’re not at the park yet · walk times off',
    denied: '📍 Location is blocked. Allow it for this site in your browser settings.', error: '📍 Couldn’t get your location. Tap to retry.',
  }[geoState];
  $('#now').hidden = tab !== 'now'; $('#pick').hidden = tab !== 'pick';
  tab === 'now' ? renderNow() : renderPick();
}

$('#t-now').onclick = () => { tab = 'now'; render(); };
$('#t-pick').onclick = () => { tab = 'pick'; render(); };
$('#refresh').onclick = load;
$('#geo').onclick = () => { if (geoState !== 'on' && geoState !== 'wait') startGeo(); };
$('#q').oninput = renderPick;
setInterval(() => { if (!document.hidden) load(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - fetchedAt > 30000) load(); });

// ?at=lat,lng fakes a position for testing walk times away from the park.
const fake = new URLSearchParams(location.search).get('at');
if (fake) { const [lat, lng] = fake.split(',').map(Number); pos = {lat, lng}; geoState = 'on'; }
else if (store.get('geo', 0)) startGeo();

// ?selftest: the one check that fails if the ranking logic breaks.
if (location.search.includes('selftest')) {
  const ok = score(20, 0, 60) < score(15, 0, 20) && score(20, 10, 40) > score(20, 0, 40) && score(null, 0, 30) === Infinity
    && label(5, 30)[0] === 'Walk-on' && label(30, 60)[0] === 'Great time' && label(60, 40)[0] === 'Very busy' && label(40, 40)[0] === 'Typical'
    && walkMin({lat: 33.81, lng: -117.919}, {lat: 33.811, lng: -117.919}) === 2;
  document.title = ok ? 'selftest ok' : 'selftest FAILED';
}
render(); load();
</script>
</body>
</html>
