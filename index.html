<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wilck">
<meta name="theme-color" content="#14213d">
<title>Wilck</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#eef0f4;--card:#fff;--ink:#14213d;--mute:#5b6577;--line:#dfe3ea;--brand:#14213d;--accent:#fca311;--on-accent:#14213d;
  --vg:#0a7d3c;--g:#3c8f2f;--avg:#5b6577;--busy:#c2610c;--vb:#b42318;--ll:#6d28d9}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#161d33;--ink:#f1f3f8;--mute:#a3acc0;--line:#283150;--brand:#0b1020;
  --vg:#4ade80;--g:#86d96b;--avg:#a3acc0;--busy:#fb923c;--vb:#f87171;--ll:#c4b5fd}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:active{opacity:.6}
[hidden]{display:none!important}

header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.top{display:flex;align-items:center;gap:8px}
h1{font-size:21px;margin:0;flex:1;letter-spacing:.2px}
.hbtn{background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 12px;font-size:14px;min-height:38px;white-space:nowrap}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:10px;padding:3px;margin-top:10px}
.seg button{flex:1;color:#fff;font-size:14px;font-weight:600;padding:7px 4px;border-radius:8px;opacity:.8}
.seg button[aria-pressed=true]{background:#fff;color:#14213d;opacity:1}
.toast{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:10px 12px;margin-top:8px;font-weight:650;font-size:15px}
.toast span{flex:1}

main{padding:12px 12px calc(env(safe-area-inset-bottom) + 92px);max-width:640px;margin:0 auto}
h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mute);margin:20px 6px 8px}
.card{background:var(--card);border-radius:16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(20,33,61,.06);overflow:hidden}
.pad{padding:14px}
.warn{background:#fff4d6;color:#6b4a00;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.note{color:var(--mute);font-size:14px;padding:8px 6px}
.hours{padding:0 6px 8px;font-size:13px}
.note a{color:inherit;font-weight:650}

/* tones */
.vg{--tone:var(--vg)}.g{--tone:var(--g)}.avg{--tone:var(--avg)}.busy{--tone:var(--busy)}.vb{--tone:var(--vb)}.none{--tone:var(--mute)}
.tag{font-weight:700;color:var(--tone)}
.pill{flex:none;width:58px;height:58px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--tone);background:color-mix(in srgb,var(--tone) 14%,transparent)}
.pill b{font-size:24px;line-height:1}
.pill span{font-size:11px;font-weight:600;margin-top:2px}
.pill.txt{font-size:12px;font-weight:600;text-align:center;line-height:1.15;padding:4px}
.pill.big{width:84px;height:84px;border-radius:18px}
.pill.big b{font-size:38px}
.pill.big span{font-size:13px}

/* hero */
.hero{border:2px solid var(--accent)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--on-accent);background:var(--accent);padding:6px 14px}
.herotop{display:flex;gap:12px;align-items:center}
.hero .name{font-size:23px;line-height:1.15;font-weight:750}
.why{margin-top:6px;font-size:15px;color:var(--mute)}
.extra{font-size:14px;color:var(--mute);margin-top:3px}
.llc{color:var(--ll);font-weight:650}
.acts{display:flex;gap:8px;margin-top:14px}
.btn{border-radius:12px;padding:12px 14px;min-height:46px;font-weight:650;background:var(--bg)}
.btn.primary{flex:1;background:var(--ink);color:var(--card)}
.btn.small{padding:8px 12px;min-height:38px;font-size:14px;flex:none}
.btn.llb{background:var(--ll);color:var(--card)}

/* rows */
.row{display:flex;gap:10px;align-items:center;padding:10px 12px}
.row + .row{border-top:1px solid var(--line)}
.main{flex:1;min-width:0}
.name{font-weight:650}
.star{color:var(--accent)}
.park{font-size:10px;font-weight:800;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.meta{font-size:13.5px;color:var(--mute);margin-top:2px}
.chk{flex:none;width:44px;height:44px;margin:-4px -6px -4px -8px;display:grid;place-items:center}
.chk i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:14px;color:transparent}
.chk.on i{background:var(--vg);border-color:var(--vg);color:var(--card)}
.off .name,.off .meta{color:var(--mute)}
.off .name{font-weight:500}
.done .name{text-decoration:line-through}
.when{flex:none;width:64px;font-weight:700;font-size:14px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 11px;min-height:34px;font-size:14px;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.addform{display:grid;gap:10px}
.addform select,.addform input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary h2::after{content:" ▾"}
details[open] summary h2::after{content:" ▴"}

/* picker */
#q{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px}
.picktools{display:flex;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.pickrow{padding:0}
.pickrow.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pickmain{flex:1;min-width:0;display:flex;gap:10px;align-items:center;padding:10px 12px;text-align:left}
.pickrow small{color:var(--mute);white-space:nowrap;font-size:13px}
.starbtn{flex:none;width:48px;align-self:stretch;font-size:22px;color:var(--line)}
.starbtn.on{color:var(--accent)}

/* map */
main.mapmode{padding:0;max-width:none}
#mapmsg{position:absolute;z-index:4;left:12px;right:12px;margin-top:12px}
#mapbox{width:100%;background:var(--line)}
.mk{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;
  background:var(--card);color:var(--ink);border:3px solid var(--tone);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.mk.none{font-weight:500;opacity:.85}
.mk.llm{--tone:var(--ll)}
.mk.best{width:46px;height:46px;margin:-3px;font-size:17px;background:var(--accent);color:var(--on-accent);border-color:var(--on-accent)}
#mapbox .leaflet-popup-content-wrapper,#mapbox .leaflet-popup-tip{background:var(--card);color:var(--ink)}
.leaflet-popup-content{margin:14px;font:inherit;font-size:15px}
.leaflet-popup-content .acts{margin-top:10px}
a.btn{text-decoration:none;color:var(--ink)!important;display:inline-flex;align-items:center}
.leaflet-container a.leaflet-popup-close-button{width:36px;height:36px;font-size:24px}

/* bottom tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 9px;font-size:12px;font-weight:650;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:21px;font-weight:400;line-height:1}
nav button[aria-selected=true]{color:var(--ink)}
nav button[aria-selected=true] span{border-bottom:2px solid var(--accent)}
</style>
</head>
<body>
<header>
  <div class="top"><h1>🎢 Wilck</h1><button class="hbtn" id="geo"></button><button class="hbtn" id="refresh" aria-label="Refresh"></button></div>
  <div class="seg" id="seg"></div>
  <div id="toasts"></div>
</header>
<main>
  <section id="now"></section>
  <section id="map" hidden><div id="mapmsg" class="warn" hidden></div><div id="mapbox"></div></section>
  <section id="pick" hidden>
    <input id="q" type="search" placeholder="Search rides and shows" autocomplete="off">
    <div id="picklist"></div>
  </section>
</main>
<nav><button id="t-now"><b>⏱</b><span>Now</span></button><button id="t-map"><b>🗺</b><span>Map</span></button><button id="t-pick"><b>☑</b><span id="t-pick-label"></span></button></nav>
<script>
// Wilck: pick your rides, see the best one to do right now. Static page, no login, no server.
// Wait times, Lightning Lane return times, forecasts, show times and locations all come from themeparks.wiki.
const ROOT = 'https://api.themeparks.wiki/v1/entity/', API = ROOT + 'bfc89fd6-314d-44b4-b89e-df1a89cf991e'; // Disneyland Resort
const PARKS = {'7340550b-c14d-4def-80bb-acdb51d49a66': ['Disneyland', 'DL'], '832fcd51-ea19-4e77-85c7-75d5843b127c': ['California Adventure', 'DCA']};
const HEADLINERS = ['Space Mountain', 'Big Thunder', 'Indiana Jones', 'Matterhorn', 'Pirates of the Caribbean', 'Haunted Mansion', 'Rise of the Resistance',
  'Smugglers Run', 'Tiana', 'Runaway Railway', 'Peter Pan', 'Radiator Springs', 'Guardians of the Galaxy', 'Incredicoaster', 'Soarin', 'WEB SLINGERS', 'Toy Story Midway'];
const CENTER = {lat: 33.809, lng: -117.919}, TZ = 'America/Los_Angeles', SKIP_MIN = 20, MIN = 6e4, HOUR = 36e5;
const LL_GAP = 2 * HOUR;      // Multi Pass: book the next one 2 hours after booking, or once you scan in
const NEAR_MIN = 3;           // "near you" = this many minutes' walk or less
const STAR_BOOST = .6;        // must-dos rank as if their wait were this much better
const PUSH = 'https://push-production-4e7fd449.up.railway.app';   // server/index.js on Railway
const VAPID_PUBLIC = 'BE8pGnnpSuYR3Cw4esIOlIWUzNJiePoNsWNK6GQQinOU50gZHzbasnyZs7sw7tDe8baH9DwOpf1djRNBDYViAcU';
const $ = s => document.querySelector(s);

const store = {
  get(k, d) { try { const v = localStorage.getItem('wilck.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('wilck.' + k, JSON.stringify(v)); } catch {} },
};
const parkDay = () => new Date().toLocaleDateString('en-CA', {timeZone: TZ});
const clock = t => new Date(t).toLocaleTimeString('en-US', {timeZone: TZ, hour: 'numeric', minute: '2-digit'});
const hour = t => new Date(t).toLocaleTimeString('en-US', {timeZone: TZ, hour: 'numeric'});
// "10:30" on a park date -> timestamp, in park time whatever the phone's time zone.
function at(date, hm) {
  const g = Date.parse(`${date}T${hm}:00Z`);
  return 2 * g - Date.parse(new Date(g).toLocaleString('sv-SE', {timeZone: TZ}).replace(' ', 'T') + 'Z');
}
const dateOf = t => new Date(t).toLocaleDateString('en-CA', {timeZone: TZ});
const mins = ms => Math.max(0, Math.round(ms / MIN));
const span = ms => mins(ms) < 90 ? mins(ms) + ' min' : Math.round(ms / HOUR) + ' h';

const hadSel = store.get('sel', null) !== null;
let sel = new Set(store.get('sel', []));    // picked rides and shows
let stars = new Set(store.get('stars', [])); // must-dos
let park = store.get('park', 'all');
let tab = sel.size ? 'now' : 'pick';
let day = store.get('day', null);           // rode-it, skips, booked Lightning Lanes, fired alerts; reset each park day
let cache = store.get('live', {t: 0, live: [], shows: []});
let live = cache.live, shows = cache.shows || [], fetchedAt = cache.t, failed = false, loading = false;
let places = store.get('places', {});       // id -> {lat,lng}
let hours = store.get('hours', {date: '', m: {}});
let pos = null, geoState = 'off';           // off | wait | on | denied | error
let doneOpen = false, planOpen = null, addOpen = false, form = {id: '', hm: ''}, toasts = [], imported = false;

function freshDay() {
  if (!day || day.date !== parkDay()) {
    // Bookings and show times entered ahead (e.g. the night before) carry into the new day.
    const old = day || {}, now = Date.now();
    day = {date: parkDay(), done: [], ll: {}, showAt: {}};
    for (const [id, w] of Object.entries(old.ll || {})) if (w.end > now) day.ll[id] = w;
    for (const [id, t] of Object.entries(old.showAt || {})) if (t > now) day.showAt[id] = t;
  }
  day.skip ||= {}; day.fired ||= {}; day.showAt ||= {};
}
const saveDay = () => { store.set('day', day); sync(); };
function savePicks() {
  store.set('sel', [...sel]); store.set('stars', [...stars]);
  history.replaceState(null, '', '#' + picksHash('p'));   // so Add to Home Screen and Share carry the picks
  sync();
}
const picksHash = key => key + '=' + [...sel].map(i => i.slice(0, 8)).join('.') + (stars.size ? '&s=' + [...stars].map(i => i.slice(0, 8)).join('.') : '');
// Picks arrive in the URL from a shared link (#share=) or from the home-screen copy of this page (#p=).
function importPicks() {
  if (imported || !(live.length || shows.length)) return;
  imported = true;
  const p = new URLSearchParams(location.hash.slice(1)), list = p.get('share') ?? p.get('p');
  if (list && (!hadSel || (p.has('share') && confirm('Replace your picks with the shared list?')))) {
    const full = pre => [...live, ...shows].find(a => a.id.startsWith(pre))?.id;
    sel = new Set(list.split('.').map(full).filter(Boolean));
    stars = new Set((p.get('s') || '').split('.').map(full).filter(Boolean));
    if (sel.size) tab = 'now';
  }
  if (hadSel || sel.size) savePicks();
}

// ---- scoring (pure) ----
// ponytail: "bang for buck" = (wait + walk) against what this ride usually costs the rest of today.
// Thresholds are the old Wilck ones (70/90/110/130% of average). Tune here if the ranking feels off.
function score(wait, walk, typical, star) {
  if (wait == null) return Infinity;
  return (wait + (walk || 0) + 5) / ((typical ?? wait) + 5) * (star ? STAR_BOOST : 1);
}
function label(wait, typical) {
  if (wait == null) return null;
  if (wait <= 10) return ['Walk-on', 'vg'];
  if (!typical) return null;
  const r = wait / typical;
  return r <= .7 ? ['Great time', 'vg'] : r <= .9 ? ['Good time', 'g'] : r <= 1.1 ? ['Typical', 'avg'] : r <= 1.3 ? ['Busy', 'busy'] : ['Very busy', 'vb'];
}
function meters(a, b) {
  const R = 6371000, rad = Math.PI / 180, dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
// ponytail: straight line x1.4 at a slow crowd pace (70 m/min). No path map; add one if walk times mislead.
const walkMin = (a, b) => Math.max(1, Math.round(meters(a, b) * 1.4 / 70));
// ponytail: greedy day plan that walks the clock forward from now. At each point it does the ride you'd lose the
// most by putting off (wait now minus its best wait later; must-dos count as 15 min more urgent), then moves the
// clock on by walk + wait + RIDE_MIN. Walks start from where you are (if location is on) and then from the last ride;
// a minute of walking counts the same as a minute of waiting, so nearby rides win ties. Without location every walk is
// NO_GPS_WALK. Fixed items (booked Lightning Lanes, planned shows) hold their times and rides fit around them. If every
// ride left gets WAIT_FOR+ min shorter later, the plan leaves free time. Not a real optimiser: no meals.
const RIDE_MIN = 5, NO_GPS_WALK = 5, LL_MIN = 20, SHOW_MIN = 30, STAR_URGENCY = 15, WAIT_FOR = 20;
function plan(rides, fixed, now, close, here) {
  const waitAt = (r, t) => {
    if (t < now + 30 * MIN && r.status && r.status !== 'OPERATING') return 999;   // down right now: not before it's had time to reopen
    if (r.wait != null && t < now + 30 * MIN) return r.wait;
    let w = r.fut[0].w;
    for (const f of r.fut) if (f.t <= t) w = f.w;
    return w;
  };
  const urgency = (r, t) => waitAt(r, t) - Math.min(waitAt(r, t), ...r.fut.filter(f => f.t > t).map(f => f.w)) - (r.star ? STAR_URGENCY : 0);
  let at = here, t = now, left = rides.filter(r => r.fut.length && !['CLOSED', 'REFURBISHMENT'].includes(r.status)).map(r => ({...r, fut: [...r.fut].sort((a, b) => a.t - b.t)}));
  const fx = [...fixed].sort((a, b) => a.t - b.t), out = [];
  while (left.length && t < close) {
    const walk = r => at && places[r.id] ? walkMin(at, places[r.id]) : NO_GPS_WALK, cost = r => walk(r) + waitAt(r, t) + RIDE_MIN;
    const next = fx[0], fits = left.filter(r => !next || t + cost(r) * MIN <= next.t);
    if (!fits.length) {
      if (!next) break;
      fx.shift(); out.push(next); t = Math.max(t, next.t) + (next.ll ? LL_MIN : SHOW_MIN) * MIN; at = places[next.r.id] || at;
      continue;
    }
    const r = fits.sort((a, b) => urgency(a, t) + walk(a) - urgency(b, t) - walk(b) || waitAt(a, t) - waitAt(b, t))[0], w = waitAt(r, t);
    if (urgency(r, t) > WAIT_FOR) { t += 30 * MIN; continue; }   // everything left gets much shorter later: free time
    out.push({r: rides.find(x => x.id === r.id), t, w, walk: at && places[r.id] ? walk(r) : null});
    t += cost(r) * MIN; at = places[r.id] || at; left = left.filter(x => x !== r);
  }
  return {steps: [...out, ...fx], left: left.length};
}

function analyze(a, now, here) {
  const q = a.queue || {}, p = places[a.id], star = stars.has(a.id);
  const wait = a.status === 'OPERATING' ? (q.STANDBY?.waitTime ?? null) : null;
  const fc = (a.forecast || []).filter(f => f.waitTime > 0).map(f => ({t: Date.parse(f.time), w: f.waitTime}));
  const fut = fc.filter(f => f.t >= now - HOUR), pool = fut.length ? fut : fc;
  const typical = pool.length ? Math.round(pool.reduce((s, f) => s + f.w, 0) / pool.length) : null;
  const later = fc.filter(f => f.t > now);
  let trend = null;
  if (wait != null && later.length) {
    const lo = later.reduce((m, f) => f.w < m.w ? f : m);
    if (lo.w <= wait - 10) trend = `Better later: ~${lo.w} min around ${hour(lo.t)}`;
    else if (wait > 10 && wait <= lo.w) trend = 'As good as it gets today';
  }
  const walk = here && p ? walkMin(here, p) : null;
  const ll = q.RETURN_TIME, llOpen = ll?.state === 'AVAILABLE' && ll.returnStart ? Date.parse(ll.returnStart) : null;
  let saves = wait || 0;
  if (llOpen && llOpen - now > 45 * MIN && fc.length) saves = Math.max(saves, fc.reduce((m, f) => Math.abs(f.t - llOpen) < Math.abs(m.t - llOpen) ? f : m).w);
  return {id: a.id, name: a.name, parkId: a.parkId, status: a.status, wait, typical, trend, walk, star, fut,
    score: score(wait, walk, typical, star), tag: label(wait, typical), ll, llOpen, saves,
    llScore: llOpen ? saves - 5 * Math.max(0, (llOpen - now) / HOUR) : -Infinity, paid: q.PAID_RETURN_TIME};
}
// Next performance of a show, or the window a character meet is open.
function showNext(s, now) {
  const ts = (s.showtimes || []).map(x => ({a: Date.parse(x.startTime), b: Date.parse(x.endTime), op: x.type === 'Operating'})).sort((x, y) => x.a - y.a);
  const on = ts.find(x => x.op && x.a <= now && now < x.b);
  if (on) return {until: on.b};
  const nx = ts.find(x => x.a > now - 5 * MIN && !x.op) || ts.find(x => x.op && x.a > now);
  return nx ? {t: nx.a} : null;
}
// When the next Lightning Lane can be booked. 0 = now.
function llReady() {
  const w = Object.values(day.ll);
  return w.length && day.llAt ? Math.min(day.llAt + LL_GAP, ...w.map(x => x.start)) : 0;
}

// ---- data ----
async function load() {
  loading = true; head();
  if (!Object.keys(places).length || Date.now() - store.get('placesAt', 0) > 7 * 864e5) {
    try {
      const j = await (await fetch(API + '/children')).json();
      places = {};
      for (const c of j.children) if (c.location?.latitude) places[c.id] = {lat: c.location.latitude, lng: c.location.longitude};
      store.set('places', places); store.set('placesAt', Date.now());
    } catch {}
  }
  try {
    const r = await fetch(API + '/live', {cache: 'no-store'});
    if (!r.ok) throw 0;
    const all = (await r.json()).liveData.filter(x => PARKS[x.parkId]);
    live = all.filter(x => x.entityType === 'ATTRACTION');
    shows = all.filter(x => x.entityType === 'SHOW' && x.showtimes?.length).map(({id, name, parkId, showtimes}) => ({id, name, parkId, showtimes}));
    fetchedAt = Date.now(); failed = false;

    const list = myShows.map(s => ({s, n: day.showAt[s.id] > now - 30 * MIN ? {t: day.showAt[s.id], pin: 1} : showNext(s, now), walk: here && places[s.id] ? walkMin(here, places[s.id]) : null}))
      .sort((a, b) => (a.n ? a.n.t || 0 : Infinity) - (b.n ? b.n.t || 0 : Infinity));
    out.push(h('h2', null, 'Shows'), h('div', {class: 'card'}, list.map(({s, n, walk}) => h('div', {class: 'row' + (n ? '' : ' off')},
      h('div', {class: 'main'}, nameEl(s), h('div', {class: 'meta'}, dots([
        n?.pin && h('span', {class: 'llc'}, `📌 Going at ${when(n.t)}`),
        !n ? 'No more today' : n.until ? `On now until ${clock(n.until)}` : n.t > now ? `in ${span(n.t - now)}` : 'Starting now',
        walk != null && `🚶 ${walk} min`])),
        upcoming(s, now).length > 0 && h('div', {class: 'chips'}, upcoming(s, now).slice(0, 8).map(t =>
          h('button', {class: 'chip' + (day.showAt[s.id] === t ? ' on' : ''), onclick: pinShow(s.id, t)}, clock(t))))),
      n?.t && h('div', {class: 'pill txt none'}, clock(n.t))))));
  }

  if (open.length) out.push(h('h2', null, 'Up next'), h('div', {class: 'card'}, open.map(r => rideRow(r, now))));
  if (shut.length) out.push(h('h2', null, 'Not running'), h('div', {class: 'card'}, shut.map(r => rideRow(r, now))));

  // Fixed points in the day: booked Lightning Lanes and shows you've picked a time for. Rides fill in around them.
  const fixed = [...booked.map(r => ({r, t: day.ll[r.id].start, ll: 1})),
    ...myShows.filter(s => day.showAt[s.id] > now - 30 * MIN).map(s => ({r: s, t: day.showAt[s.id]}))];
  const close = hours.date === day.date && Object.keys(hours.m).length ? Math.max(...Object.values(hours.m).map(x => x[1])) : now + 12 * HOUR;
  const {steps: dayPlan, left} = plan(active, fixed, now, close, here), noFc = active.filter(r => !r.fut.length).length;
  const round5 = t => Math.round(t / (5 * MIN)) * 5 * MIN;
  if (dayPlan.length > 1 || fixed.length) out.push(h('details', {open: planOpen ?? fixed.length > 0, ontoggle: e => { planOpen = e.target.open; }},
    h('summary', null, h('h2', null, 'Your day plan')),
    h('div', {class: 'card'}, dayPlan.map(x => h('div', {class: 'row'},
      h('div', {class: 'when' + (x.w == null ? ' llc' : '')}, x.w == null ? clock(x.t) : x.t <= now + 5 * MIN ? 'Now' : clock(round5(x.t))),
      h('div', {class: 'main'}, nameEl(x.r), dateOf(x.t) !== parkDay() && h('div', {class: 'meta'}, 'Tomorrow')),
      h('div', {class: 'meta'}, x.w != null ? (x.walk != null ? `🚶 ${x.walk} · ` : '') + `~${x.w} min` : x.ll ? '⚡ Lightning Lane' : '🎭 Show')))),
    h('div', {class: 'note'}, 'Rebuilt on every refresh from live waits and where you are. Starts now and runs to closing: each ride’s walk, wait and about 5 minutes to ride. Rides that get much better later wait; must-dos go sooner. Lightning Lanes and show times you’ve set stay put.'
      + (left > 0 ? ` ${left} of your rides don’t fit before closing.` : '')
      + (noFc > 0 ? ` ${noFc} of your rides have no forecast, so fit them in when the wait looks good.` : ''))));

  if (done.length) out.push(h('details', {open: doneOpen, ontoggle: e => { doneOpen = e.target.open; }},
    h('summary', null, h('h2', null, `Done today (${done.length})`)),
    h('div', {class: 'card'}, done.map(r => h('div', {class: 'row off done'}, check(r, true), h('div', {class: 'main'}, nameEl(r)))))));
  if (!navigator.standalone && !matchMedia('(display-mode: standalone)').matches)
    out.push(h('div', {class: 'note'}, 'Tip: tap Share, then Add to Home Screen, to open Wilck like an app and get lock-screen alerts.'));
  if (pushSub) out.push(h('div', {class: 'note'}, '🔔 Lock-screen alerts are on. ', h('a', {href: '#', onclick: e => { e.preventDefault(); sync(true); }}, 'Send a test')));
  $('#now').replaceChildren(...out);
}

function share() {
  const url = location.origin + location.pathname + '#' + picksHash('share');
  if (navigator.share) navigator.share({title: 'Wilck', text: 'My Disneyland ride list', url}).catch(() => {});
  else navigator.clipboard?.writeText(url).then(() => { toast('Link copied'); render(); });
}
function renderPick() {
  const q = $('#q').value.trim().toLowerCase(), out = [], now = Date.now();
  if (!live.length) return $('#picklist').replaceChildren(h('div', {class: 'note'}, failed ? `Couldn't load the ride list. Tap ↻.` : 'Loading rides…'));
  const set = () => { savePicks(); render(); };
  out.push(h('div', {class: 'picktools'},
    btn('＋ Add the headliners', () => { for (const a of live) if (inPark(a) && HEADLINERS.some(n => a.name.includes(n))) sel.add(a.id); set(); }, 'small'),
    sel.size > 0 && btn('Share my list', share, 'small'),
    sel.size > 0 && btn('Clear all', () => { if (confirm('Clear all your picks?')) { sel.clear(); stars.clear(); set(); } }, 'small')));
  if (sel.size) out.push(h('div', {class: 'note'}, 'Tap ★ on a pick to make it a must-do. Must-dos rank higher.'));
  const group = (title, list, right, starrable) => {
    list = list.filter(a => inPark(a) && a.name.toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
    if (list.length) out.push(h('h2', null, title), h('div', {class: 'card'}, list.map(a => {
      const on = sel.has(a.id), st = stars.has(a.id);
      return h('div', {class: 'row pickrow' + (on ? ' sel' : '')},
        h('button', {class: 'pickmain', role: 'checkbox', 'aria-checked': String(on),
          onclick: () => { if (on) { sel.delete(a.id); stars.delete(a.id); } else sel.add(a.id); set(); }},
          h('span', {class: 'chk' + (on ? ' on' : '')}, h('i', null, '✓')), h('span', {class: 'main name'}, a.name), h('small', null, right(a))),
        on && starrable && h('button', {class: 'starbtn' + (st ? ' on' : ''), 'aria-label': (st ? 'Remove must-do: ' : 'Must-do: ') + a.name,
          onclick: () => { st ? stars.delete(a.id) : stars.add(a.id); set(); }}, '★'));
    })));
  };
  const wait = a => a.status === 'OPERATING' ? (a.queue?.STANDBY?.waitTime != null ? a.queue.STANDBY.waitTime + ' min' : 'Open') : (OFF[a.status] || a.status);
  const next = s => { const n = showNext(s, now); return !n ? 'Done today' : n.until ? 'On now' : clock(n.t); };
  for (const [id, n] of Object.entries(PARKS)) group(n[0], live.filter(a => a.parkId === id), wait, true);
  for (const [id, n] of Object.entries(PARKS)) group(n[0] + ' shows', shows.filter(a => a.parkId === id), next, false);
  if (!out.some(e => e.tagName === 'H2')) out.push(h('div', {class: 'note'}, 'Nothing matches.'));
  $('#picklist').replaceChildren(...out);
}

function head() {
  $('#t-pick-label').textContent = `My picks (${sel.size})`;
  $('#t-now').setAttribute('aria-selected', tab === 'now');
  $('#t-pick').setAttribute('aria-selected', tab === 'pick');
  $('#t-map').setAttribute('aria-selected', tab === 'map');
  $('#refresh').textContent = loading ? '↻ …' : fetchedAt ? '↻ ' + clock(fetchedAt) : '↻';
  $('#geo').textContent = {off: '📍 Off', wait: '📍 Finding…', on: atPark() ? '📍 On' : '📍 Not in park', denied: '📍 Blocked', error: '📍 Retry'}[geoState];
  $('#seg').replaceChildren(...[['all', 'Both parks'], ...Object.entries(PARKS).map(([id, n]) => [id, n[0]])].map(([id, n]) =>
    h('button', {'aria-pressed': String(park === id), onclick: () => { park = id; fitted = false; store.set('park', id); render(); }}, n)));
  $('#toasts').replaceChildren(...toasts.map(t => h('button', {class: 'toast', onclick: () => { toasts = toasts.filter(x => x !== t); render(); }},
    h('span', null, t.text), '✕')));
}
function render() {
  freshDay(); head();
  $('#now').hidden = tab !== 'now'; $('#pick').hidden = tab !== 'pick'; $('#map').hidden = tab !== 'map';
  $('main').classList.toggle('mapmode', tab === 'map');
  tab === 'now' ? renderNow() : tab === 'pick' ? renderPick() : renderMap();
}

$('#t-now').onclick = () => { tab = 'now'; render(); scrollTo(0, 0); };
$('#t-map').onclick = () => { tab = 'map'; render(); scrollTo(0, 0); };
$('#t-pick').onclick = () => { tab = 'pick'; render(); scrollTo(0, 0); };
$('#refresh').onclick = load;
$('#geo').onclick = () => { if (geoState !== 'on' && geoState !== 'wait') startGeo(); };
$('#q').oninput = renderPick;
setInterval(() => { if (!document.hidden) load(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - fetchedAt > 30000) load(); });
setInterval(() => { if (!document.hidden) { alerts(); head(); } }, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(initPush).catch(() => {});

// ?at=lat,lng fakes a position for testing walk times away from the park.
const fake = new URLSearchParams(location.search).get('at');
if (fake) { const [lat, lng] = fake.split(',').map(Number); pos = {lat, lng}; geoState = 'on'; }
else if (store.get('geo', 0)) startGeo();

// ?selftest: the one check that fails if the ranking, plan or show logic breaks.
if (location.search.includes('selftest')) {
  const T = Date.parse('2026-11-10T12:00:00-08:00'), f = (h, w) => ({t: T + h * HOUR, w});
  const R = [{id: 'a', star: false, fut: [f(0, 30), f(1, 60)]}, {id: 'b', star: false, fut: [f(0, 20), f(1, 25)]},
    {id: 'c', star: true, fut: [f(0, 10), f(1, 90)]}, {id: 'd', star: false, fut: [f(0, 60), f(5, 5)]}];
  const p = plan(R, [], T, T + 12 * HOUR).steps, ids = p.map(x => x.r.id).join('');
  const q = plan(R.slice(0, 1), [{r: {id: 's'}, t: T + 10 * MIN}], T, T + 12 * HOUR).steps;
  const st = t => ({type: 'Performance Time', startTime: new Date(T + t * HOUR).toISOString(), endTime: new Date(T + t * HOUR).toISOString()});
  const ok = score(20, 0, 60) < score(15, 0, 20) && score(20, 10, 40) > score(20, 0, 40) && score(null, 0, 30) === Infinity
    && score(30, 0, 30, true) < score(25, 0, 30) && label(5, 30)[0] === 'Walk-on' && label(30, 60)[0] === 'Great time'
    && label(60, 40)[0] === 'Very busy' && label(40, 40)[0] === 'Typical'
    && walkMin({lat: 33.81, lng: -117.919}, {lat: 33.811, lng: -117.919}) === 2
    && ids === 'cbad' && p[0].t === T && p[1].t === T + 20 * MIN && p[3].t === T + 5 * HOUR   // must-do first, starts now; d waits for its 5-min slot
    && plan([{id: 'x', status: 'DOWN', fut: [f(0, 10)]}, ...R.slice(1, 2)], [], T, T + 12 * HOUR).steps[0].r.id === 'b'   // down ride not first
    && plan([{id: 'x', status: 'REFURBISHMENT', fut: [f(0, 10)]}], [], T, T + 12 * HOUR).steps.length === 0
    && (() => { places.n1 = {lat: 33.8100, lng: -117.919}; places.n2 = {lat: 33.8150, lng: -117.919};
         const z = plan([{id: 'n2', fut: [f(0, 20)]}, {id: 'n1', fut: [f(0, 20)]}], [], T, T + 12 * HOUR, {lat: 33.8101, lng: -117.919}).steps;
         delete places.n1; delete places.n2; return z[0].r.id === 'n1' && z[1].walk > 5; })()   // nearest first, then walk from there
    && q[0].r.id === 's' && q[1].t === T + 40 * MIN                   // a ride can't fit before the 12:10 show, so the show goes first
    && at('2026-11-10', '10:30') === Date.parse('2026-11-10T10:30:00-08:00') && at('2026-07-04', '09:05') === Date.parse('2026-07-04T09:05:00-07:00')
    && showNext({showtimes: [st(-2), st(3)]}, T).t === T + 3 * HOUR && showNext({showtimes: [st(-2)]}, T) === null;
  document.title = ok ? 'selftest ok' : 'selftest FAILED';
}
render(); load();
</script>
</body>
</html>
