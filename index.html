<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wilck">
<meta name="theme-color" content="#14213d">
<title>Wilck</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎢</text></svg>">
<style>
:root{--bg:#eef0f4;--card:#fff;--ink:#14213d;--mute:#5b6577;--line:#dfe3ea;--brand:#14213d;--accent:#fca311;--on-accent:#14213d;
  --vg:#0a7d3c;--g:#3c8f2f;--avg:#5b6577;--busy:#c2610c;--vb:#b42318;--ll:#6d28d9}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#161d33;--ink:#f1f3f8;--mute:#a3acc0;--line:#283150;--brand:#0b1020;
  --vg:#4ade80;--g:#86d96b;--avg:#a3acc0;--busy:#fb923c;--vb:#f87171;--ll:#c4b5fd}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:active{opacity:.6}
[hidden]{display:none!important}

header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.top{display:flex;align-items:center;gap:8px}
h1{font-size:21px;margin:0;flex:1;letter-spacing:.2px}
.hbtn{background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 12px;font-size:14px;min-height:38px;white-space:nowrap}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:10px;padding:3px;margin-top:10px}
.seg button{flex:1;color:#fff;font-size:14px;font-weight:600;padding:7px 4px;border-radius:8px;opacity:.8}
.seg button[aria-pressed=true]{background:#fff;color:#14213d;opacity:1}

main{padding:12px 12px calc(env(safe-area-inset-bottom) + 92px);max-width:640px;margin:0 auto}
h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mute);margin:20px 6px 8px}
.card{background:var(--card);border-radius:16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(20,33,61,.06);overflow:hidden}
.pad{padding:14px}
.warn{background:#fff4d6;color:#6b4a00;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.note{color:var(--mute);font-size:14px;padding:8px 6px}

/* tones */
.vg{--tone:var(--vg)}.g{--tone:var(--g)}.avg{--tone:var(--avg)}.busy{--tone:var(--busy)}.vb{--tone:var(--vb)}.none{--tone:var(--mute)}
.tag{font-weight:700;color:var(--tone)}
.pill{flex:none;width:58px;height:58px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--tone);background:color-mix(in srgb,var(--tone) 14%,transparent)}
.pill b{font-size:24px;line-height:1}
.pill span{font-size:11px;font-weight:600;margin-top:2px}
.pill.txt{font-size:12px;font-weight:600;text-align:center;line-height:1.15;padding:4px}
.pill.big{width:84px;height:84px;border-radius:18px}
.pill.big b{font-size:38px}
.pill.big span{font-size:13px}

/* hero */
.hero{border:2px solid var(--accent)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--on-accent);background:var(--accent);padding:6px 14px}
.herotop{display:flex;gap:12px;align-items:center}
.hero .name{font-size:23px;line-height:1.15;font-weight:750}
.why{margin-top:6px;font-size:15px;color:var(--mute)}
.extra{font-size:14px;color:var(--mute);margin-top:3px}
.llc{color:var(--ll);font-weight:650}
.acts{display:flex;gap:8px;margin-top:14px}
.btn{border-radius:12px;padding:12px 14px;min-height:46px;font-weight:650;background:var(--bg)}
.btn.primary{flex:1;background:var(--ink);color:var(--card)}
.btn.small{padding:8px 12px;min-height:38px;font-size:14px;flex:none}
.btn.llb{background:var(--ll);color:var(--card)}

/* rows */
.row{display:flex;gap:10px;align-items:center;padding:10px 12px}
.row + .row{border-top:1px solid var(--line)}
.main{flex:1;min-width:0}
.name{font-weight:650}
.park{font-size:10px;font-weight:800;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.meta{font-size:13.5px;color:var(--mute);margin-top:2px}
.chk{flex:none;width:44px;height:44px;margin:-4px -6px -4px -8px;display:grid;place-items:center}
.chk i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:14px;color:transparent}
.chk.on i{background:var(--vg);border-color:var(--vg);color:var(--card)}
.off .name,.off .meta{color:var(--mute)}
.off .name{font-weight:500}
.done .name{text-decoration:line-through}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary h2::after{content:" ▾"}
details[open] summary h2::after{content:" ▴"}

/* picker */
#q{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px}
.picktools{display:flex;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.pickrow{width:100%;text-align:left}
.pickrow.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pickrow small{color:var(--mute);white-space:nowrap;font-size:13px}

/* map */
main.mapmode{padding:0;max-width:none}
#mapmsg{position:absolute;z-index:4;left:12px;right:12px;margin-top:12px}
#mapbox{width:100%;background:var(--line)}
.mk{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;
  background:var(--card);color:var(--ink);border:3px solid var(--tone);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.mk.none{font-weight:500;opacity:.85}
.mk.llm{--tone:var(--ll)}
.mk.best{width:46px;height:46px;margin:-3px;font-size:17px;background:var(--accent);color:var(--on-accent);border-color:var(--on-accent)}
#mapbox .leaflet-popup-content-wrapper,#mapbox .leaflet-popup-tip{background:var(--card);color:var(--ink)}
.leaflet-popup-content{margin:14px;font:inherit;font-size:15px}
.leaflet-popup-content .acts{margin-top:10px}
a.btn{text-decoration:none;color:var(--ink)!important;display:inline-flex;align-items:center}
.leaflet-container a.leaflet-popup-close-button{width:36px;height:36px;font-size:24px}

/* bottom tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 9px;font-size:12px;font-weight:650;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:21px;font-weight:400;line-height:1}
nav button[aria-selected=true]{color:var(--ink)}
nav button[aria-selected=true] span{border-bottom:2px solid var(--accent)}
</style>
</head>
<body>
<header>
  <div class="top"><h1>🎢 Wilck</h1><button class="hbtn" id="geo"></button><button class="hbtn" id="refresh" aria-label="Refresh"></button></div>
  <div class="seg" id="seg"></div>
</header>
<main>
  <section id="now"></section>
  <section id="map" hidden><div id="mapmsg" class="warn" hidden></div><div id="mapbox"></div></section>
  <section id="pick" hidden>
    <input id="q" type="search" placeholder="Search rides" autocomplete="off">
    <div id="picklist"></div>
  </section>
</main>
<nav><button id="t-now"><b>⏱</b><span>Now</span></button><button id="t-map"><b>🗺</b><span>Map</span></button><button id="t-pick"><b>☑</b><span id="t-pick-label"></span></button></nav>
<script>
// Wilck: pick your rides, see the best one to do right now. Static page, no login, no server.
// Wait times, Lightning Lane return times, forecasts and ride locations all come from themeparks.wiki.
const API = 'https://api.themeparks.wiki/v1/entity/bfc89fd6-314d-44b4-b89e-df1a89cf991e'; // Disneyland Resort
const PARKS = {'7340550b-c14d-4def-80bb-acdb51d49a66': ['Disneyland', 'DL'], '832fcd51-ea19-4e77-85c7-75d5843b127c': ['California Adventure', 'DCA']};
const HEADLINERS = ['Space Mountain', 'Big Thunder', 'Indiana Jones', 'Matterhorn', 'Pirates of the Caribbean', 'Haunted Mansion', 'Rise of the Resistance',
  'Smugglers Run', 'Tiana', 'Runaway Railway', 'Peter Pan', 'Radiator Springs', 'Guardians of the Galaxy', 'Incredicoaster', 'Soarin', 'WEB SLINGERS', 'Toy Story Midway'];
const CENTER = {lat: 33.809, lng: -117.919}, TZ = 'America/Los_Angeles', SKIP_MIN = 20;
const $ = s => document.querySelector(s);

const store = {
  get(k, d) { try { const v = localStorage.getItem('wilck.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('wilck.' + k, JSON.stringify(v)); } catch {} },
};
const parkDay = () => new Date().toLocaleDateString('en-CA', {timeZone: TZ});
const clock = t => new Date(t).toLocaleTimeString('en-US', {timeZone: TZ, hour: 'numeric', minute: '2-digit'});
const hour = t => new Date(t).toLocaleTimeString('en-US', {timeZone: TZ, hour: 'numeric'});

let sel = new Set(store.get('sel', []));
let park = store.get('park', 'all');
let tab = sel.size ? 'now' : 'pick';
let day = store.get('day', null);           // rode-it, skips and booked Lightning Lanes, reset each park day
let cache = store.get('live', {t: 0, live: []});
let live = cache.live, fetchedAt = cache.t, failed = false, loading = false;
let places = store.get('places', {});       // ride id -> {lat,lng}
let pos = null, geoState = 'off';           // off | wait | on | denied | error
let doneOpen = false;

function freshDay() {
  if (!day || day.date !== parkDay()) day = {date: parkDay(), done: [], ll: {}};
  day.skip ||= {};
}
const saveDay = () => store.set('day', day);

// ---- scoring (pure) ----
// ponytail: "bang for buck" = (wait + walk) against what this ride usually costs the rest of today.
// Thresholds are the old Wilck ones (70/90/110/130% of average). Tune here if the ranking feels off.
function score(wait, walk, typical) {
  if (wait == null) return Infinity;
  return (wait + (walk || 0) + 5) / ((typical ?? wait) + 5);
}
function label(wait, typical) {
  if (wait == null) return null;
  if (wait <= 10) return ['Walk-on', 'vg'];
  if (!typical) return null;
  const r = wait / typical;
  return r <= .7 ? ['Great time', 'vg'] : r <= .9 ? ['Good time', 'g'] : r <= 1.1 ? ['Typical', 'avg'] : r <= 1.3 ? ['Busy', 'busy'] : ['Very busy', 'vb'];
}
function meters(a, b) {
  const R = 6371000, rad = Math.PI / 180, dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
// ponytail: straight line x1.4 at a slow crowd pace (70 m/min). No path map; add one if walk times mislead.
const walkMin = (a, b) => Math.max(1, Math.round(meters(a, b) * 1.4 / 70));

function analyze(a, now, here) {
  const q = a.queue || {}, p = places[a.id];
  const wait = a.status === 'OPERATING' ? (q.STANDBY?.waitTime ?? null) : null;
  const fc = (a.forecast || []).filter(f => f.waitTime > 0).map(f => ({t: Date.parse(f.time), w: f.waitTime}));
  const rest = fc.filter(f => f.t >= now - 36e5), pool = rest.length ? rest : fc;
  const typical = pool.length ? Math.round(pool.reduce((s, f) => s + f.w, 0) / pool.length) : null;
  const future = fc.filter(f => f.t > now);
  let trend = null;
  if (wait != null && future.length) {
    const lo = future.reduce((m, f) => f.w < m.w ? f : m);
    if (lo.w <= wait - 10) trend = `Should drop to ~${lo.w} min around ${hour(lo.t)}`;
    else if (wait > 10 && future.every(f => f.w >= wait + 5)) trend = 'Only gets longer from here';
  }
  const walk = here && p ? walkMin(here, p) : null;
  const ll = q.RETURN_TIME, llOpen = ll?.state === 'AVAILABLE' && ll.returnStart ? Date.parse(ll.returnStart) : null;
  let saves = wait || 0;
  if (llOpen && llOpen - now > 45 * 6e4 && fc.length) saves = Math.max(saves, fc.reduce((m, f) => Math.abs(f.t - llOpen) < Math.abs(m.t - llOpen) ? f : m).w);
  return {id: a.id, name: a.name, parkId: a.parkId, status: a.status, wait, typical, trend, walk,
    score: score(wait, walk, typical), tag: label(wait, typical), ll, llOpen, saves,
    llScore: llOpen ? saves - 5 * Math.max(0, (llOpen - now) / 36e5) : -Infinity,
    paid: q.PAID_RETURN_TIME, single: q.SINGLE_RIDER?.waitTime ?? null};
}

// ---- data ----
async function load() {
  loading = true; head();
  if (!Object.keys(places).length || Date.now() - store.get('placesAt', 0) > 7 * 864e5) {
    try {
      const j = await (await fetch(API + '/children')).json();
      places = {};
      for (const c of j.children) if (c.location?.latitude) places[c.id] = {lat: c.location.latitude, lng: c.location.longitude};
      store.set('places', places); store.set('placesAt', Date.now());
    } catch {}
  }
  try {
    const r = await fetch(API + '/live', {cache: 'no-store'});
    if (!r.ok) throw 0;
    live = (await r.json()).liveData.filter(x => x.entityType === 'ATTRACTION' && PARKS[x.parkId]);
    fetchedAt = Date.now(); failed = false;
    store.set('live', {t: fetchedAt, live});
  } catch { failed = true; }
  loading = false; render();
}

// ---- location ----
function startGeo() {
  if (!navigator.geolocation) { geoState = 'error'; return render(); }
  geoState = 'wait'; render();
  navigator.geolocation.watchPosition(p => {
    const next = {lat: p.coords.latitude, lng: p.coords.longitude};
    const moved = !pos || meters(pos, next) > 25;
    geoState = 'on'; store.set('geo', 1);
    if (moved) { pos = next; render(); }
  }, e => {
    geoState = e.code === 1 ? 'denied' : 'error';
    if (e.code === 1) store.set('geo', 0);
    pos = null; render();
  }, {enableHighAccuracy: true, maximumAge: 15000, timeout: 20000});
}
const atPark = () => pos && meters(pos, CENTER) < 2500;

// ---- view ----
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in props || {}) {
    const v = props[k];
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v != null && v !== false) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(3)) if (c != null && c !== false) e.append(c);
  return e;
}
const dots = parts => parts.filter(Boolean).flatMap((x, i) => i ? [' · ', x] : [x]);
const nameEl = r => h('div', {class: 'name'}, r.name, h('span', {class: 'park'}, PARKS[r.parkId][1]));
const OFF = {CLOSED: 'Closed', DOWN: 'Down right now', REFURBISHMENT: 'Refurb'};
const btn = (text, fn, cls) => h('button', {class: 'btn ' + (cls || ''), onclick: fn}, text);

function pill(r, big) {
  const cls = 'pill ' + (big ? 'big ' : '') + (r.tag ? r.tag[1] : 'none');
  if (r.status !== 'OPERATING') return h('div', {class: cls + ' txt'}, OFF[r.status] || r.status);
  if (r.wait == null) return h('div', {class: cls + ' txt'}, 'Open');
  return h('div', {class: cls}, h('b', null, r.wait), h('span', null, 'min'));
}
// Secondary facts shown under a ride: trend, Lightning Lane, paid lane, single rider.
function extras(r) {
  const out = [];
  if (r.trend) out.push(h('div', {class: 'extra'}, r.trend));
  if (r.paid?.state === 'AVAILABLE' && r.paid.returnStart)
    out.push(h('div', {class: 'extra'}, `Paid Lightning Lane ${r.paid.price?.formatted || ''} at ${clock(Date.parse(r.paid.returnStart))}`));
  if (r.single != null) out.push(h('div', {class: 'extra'}, `Single rider: ${r.single} min`));
  return out;
}
const rode = id => () => { day.done.push(id); delete day.ll[id]; saveDay(); render(); };
const unrode = id => () => { day.done = day.done.filter(x => x !== id); saveDay(); render(); };
const skip = id => () => { day.skip[id] = Date.now() + SKIP_MIN * 6e4; saveDay(); render(); };
const book = r => () => { day.ll[r.id] = {start: r.llOpen, end: r.ll.returnEnd ? Date.parse(r.ll.returnEnd) : r.llOpen + 36e5}; saveDay(); render(); };
const unbook = id => () => { delete day.ll[id]; saveDay(); render(); };
const check = (r, on) => h('button', {class: 'chk' + (on ? ' on' : ''), 'aria-label': (on ? 'Undo ' : 'Rode ') + r.name, onclick: on ? unrode(r.id) : rode(r.id)}, h('i', null, '✓'));

function rideRow(r, now) {
  const skipped = day.skip[r.id] > now;
  return h('div', {class: 'row ' + (r.tag ? r.tag[1] : 'none') + (r.status !== 'OPERATING' ? ' off' : '')}, check(r),
    h('div', {class: 'main'}, nameEl(r),
      h('div', {class: 'meta'}, dots([r.tag && h('span', {class: 'tag'}, r.tag[0]), r.walk != null && `🚶 ${r.walk} min`,
        r.typical != null && r.wait != null && `usual ${r.typical}`, r.llOpen && h('span', {class: 'llc'}, `⚡ ${clock(r.llOpen)}`),
        skipped && `skipped till ${clock(day.skip[r.id])}`])),
      extras(r)),
    pill(r));
}

function hero(r) {
  const diff = r.typical != null ? r.typical - r.wait : 0;
  return h('div', {class: 'card hero ' + (r.tag ? r.tag[1] : 'none')},
    h('div', {class: 'eyebrow'}, 'Do this now'),
    h('div', {class: 'pad'},
      h('div', {class: 'herotop'},
        h('div', {class: 'main'}, nameEl(r),
          h('div', {class: 'why'}, dots([r.tag && h('span', {class: 'tag'}, r.tag[0]),
            diff >= 5 ? `${diff} min under usual` : diff <= -5 ? `${-diff} min over usual` : null, r.walk != null && `🚶 ${r.walk} min walk`])),
          extras(r), r.llOpen && h('div', {class: 'extra llc'}, `⚡ Lightning Lane return ${clock(r.llOpen)}`)),
        pill(r, true)),
      h('div', {class: 'acts'}, btn('✓ Rode it', rode(r.id), 'primary'), btn('Skip', skip(r.id)), places[r.id] && btn('📍 Map', showOnMap(r.id)))));
}

// One ranking shared by the list and the map.
function compute(now) {
  const here = atPark() ? pos : null;
  const rows = live.filter(a => sel.has(a.id) && (park === 'all' || a.parkId === park)).map(a => analyze(a, now, here));
  const done = rows.filter(r => day.done.includes(r.id));
  const booked = rows.filter(r => !day.done.includes(r.id) && day.ll[r.id]).sort((a, b) => day.ll[a.id].start - day.ll[b.id].start);
  const active = rows.filter(r => !day.done.includes(r.id) && !day.ll[r.id]);
  const skipped = r => day.skip[r.id] > now;
  const open = active.filter(r => r.status === 'OPERATING').sort((a, b) => skipped(a) - skipped(b) || a.score - b.score || a.wait - b.wait);
  const shut = active.filter(r => r.status !== 'OPERATING');
  // A Lightning Lane is only worth spending on a ride that would cost 15+ min of standby.
  const llPicks = open.filter(r => r.llOpen && r.saves >= 15).sort((a, b) => b.llScore - a.llScore).slice(0, 3);
  const best = open.length && open[0].wait != null && !skipped(open[0]) ? open.shift() : null;
  return {rows, done, booked, open, shut, llPicks, best};
}

// ---- map (Leaflet + OpenStreetMap, loaded the first time the Map tab opens) ----
let map, layer, leaflet, focusId = null, fitted = false;
const loadLeaflet = () => leaflet ||= new Promise((res, rej) => {
  const s = h('script', {src: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'});
  s.onload = res; s.onerror = () => { leaflet = null; s.remove(); rej(); };
  document.head.append(h('link', {rel: 'stylesheet', href: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'}), s);
});
const showOnMap = id => () => { focusId = id; tab = 'map'; render(); };
function popup(r, booked) {
  const p = places[r.id], w = day.ll[r.id];
  return h('div', {class: r.tag ? r.tag[1] : 'none'}, nameEl(r),
    h('div', {class: 'meta'}, dots([r.status !== 'OPERATING' ? (OFF[r.status] || r.status) : r.wait != null ? `${r.wait} min wait` : 'Open',
      r.tag && h('span', {class: 'tag'}, r.tag[0]), r.walk != null && `🚶 ${r.walk} min`])),
    booked && h('div', {class: 'meta llc'}, `⚡ Booked · return ${clock(w.start)} to ${clock(w.end)}`),
    !booked && r.llOpen && h('div', {class: 'meta llc'}, `⚡ Lightning Lane return ${clock(r.llOpen)}`),
    extras(r),
    h('div', {class: 'acts'}, btn('✓ Rode it', () => { map.closePopup(); rode(r.id)(); }, 'small primary'),
      h('a', {class: 'btn small', href: `https://maps.apple.com/?daddr=${p.lat},${p.lng}&dirflg=w`, target: '_blank', rel: 'noopener'}, 'Directions')));
}
async function renderMap() {
  const box = $('#mapbox'), msg = $('#mapmsg');
  box.style.height = (innerHeight - $('header').offsetHeight - $('nav').offsetHeight) + 'px';
  msg.textContent = sel.size ? '' : 'Pick rides in My rides and they show up here with their wait times.';
  msg.hidden = !msg.textContent;
  try { await loadLeaflet(); } catch { msg.textContent = 'Couldn’t load the map. Check your signal and tap Map again.'; msg.hidden = false; return; }
  if (tab !== 'map') return;
  if (!map) {
    map = L.map(box, {zoomControl: false}).setView([CENTER.lat, CENTER.lng], 16);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap'}).addTo(map);
    layer = L.layerGroup().addTo(map);
  }
  map.invalidateSize();
  if (!focusId && map._popup?.isOpen()) return;   // don't yank a popup someone is reading on the 60s refresh
  layer.clearLayers();
  const c = compute(Date.now()), pts = [];
  const add = (r, kind) => {
    const p = places[r.id];
    if (!p) return;
    pts.push([p.lat, p.lng]);
    const text = kind === 'll' ? '⚡' : r.status !== 'OPERATING' ? '×' : r.wait ?? '·';
    const m = L.marker([p.lat, p.lng], {zIndexOffset: kind === 'best' ? 1000 : 0, icon: L.divIcon({className: '', iconSize: [40, 40],
      html: `<div class="mk ${kind === 'll' ? 'llm' : r.tag ? r.tag[1] : 'none'}${kind === 'best' ? ' best' : ''}">${text}</div>`})}).addTo(layer);
    m.bindPopup(() => popup(r, kind === 'll'), {minWidth: 210});
    if (r.id === focusId) { map.setView([p.lat, p.lng], 18); m.openPopup(); }
  };
  c.shut.forEach(r => add(r)); c.open.forEach(r => add(r)); c.booked.forEach(r => add(r, 'll'));
  if (c.best) add(c.best, 'best');
  if (pos) L.circleMarker([pos.lat, pos.lng], {radius: 8, color: '#fff', weight: 3, fillColor: '#2563eb', fillOpacity: 1, interactive: false}).addTo(layer);
  if (!focusId && !fitted && pts.length) { map.fitBounds(atPark() ? [...pts, [pos.lat, pos.lng]] : pts, {padding: [40, 40], maxZoom: 18}); fitted = true; }
  focusId = null;
}

function renderNow() {
  const now = Date.now(), out = [];
  if (failed) out.push(h('div', {class: 'warn'}, fetchedAt
    ? `Couldn't refresh. Showing wait times from ${clock(fetchedAt)}.` : `Couldn't load wait times. Check your signal and tap ↻.`));
  else if (fetchedAt && now - fetchedAt > 15 * 6e4) out.push(h('div', {class: 'warn'}, `These wait times are from ${clock(fetchedAt)}. Tap ↻.`));
  if (!live.length) { out.push(h('div', {class: 'note'}, failed ? '' : 'Loading wait times…')); return $('#now').replaceChildren(...out); }
  if (!sel.size) {
    out.push(h('div', {class: 'card pad'}, h('div', {class: 'name'}, 'Pick the rides you want today'),
      h('div', {class: 'meta'}, 'Then this screen ranks them by the best use of your time right now.'),
      h('div', {class: 'acts'}, btn('Pick rides', () => { tab = 'pick'; render(); }, 'primary'))));
    return $('#now').replaceChildren(...out);
  }
  if (geoState === 'off' || geoState === 'denied' || geoState === 'error')
    out.push(h('div', {class: 'card row'}, h('div', {class: 'main'}, h('div', {class: 'name'}, 'Rank by what’s closest'),
      h('div', {class: 'meta'}, geoState === 'denied' ? 'Location is blocked. Allow it for this site in your browser settings.'
        : geoState === 'error' ? 'Couldn’t get your location.' : 'Share your location to add walk times.')),
      geoState !== 'denied' && btn(geoState === 'error' ? 'Retry' : 'Turn on', startGeo, 'small primary')));

  const {rows, done, booked, open, shut, llPicks, best} = compute(now);
  if (best) out.push(hero(best));
  else if (!rows.length) out.push(h('div', {class: 'note'}, 'None of your picks are in this park.'));
  else if (!open.length && shut.length) out.push(h('div', {class: 'note'}, 'None of your remaining picks are running right now.'));

  if (booked.length || llPicks.length) {
    out.push(h('h2', null, '⚡ Lightning Lane'));
    out.push(h('div', {class: 'card'},
      booked.map(r => {
        const w = day.ll[r.id];
        const msg = now < w.start ? `Return ${clock(w.start)} to ${clock(w.end)} · in ${Math.round((w.start - now) / 6e4)} min`
          : now <= w.end ? `Go now! Window open until ${clock(w.end)}` : `Window ended ${clock(w.end)}. Check the Disneyland app.`;
        return h('div', {class: 'row'}, check(r), h('div', {class: 'main'}, nameEl(r),
          h('div', {class: 'meta llc'}, msg),
          h('div', {class: 'meta'}, dots([r.status !== 'OPERATING' && (OFF[r.status] || r.status), r.walk != null && `🚶 ${r.walk} min`]))),
          btn('Unbook', unbook(r.id), 'small'));
      }),
      llPicks.map((r, i) => h('div', {class: 'row'}, h('div', {class: 'main'}, nameEl(r),
        h('div', {class: 'meta'}, h('span', {class: 'llc'}, `${i ? 'Or' : 'Book next'} · return ${clock(r.llOpen)}`), ` · skips ~${r.saves} min`)),
        btn('Booked', book(r), 'small llb')))));
    if (llPicks.length) out.push(h('div', {class: 'note'}, 'Book in the Disneyland app, then tap Booked.'));
  }

  if (open.length) out.push(h('h2', null, 'Up next'), h('div', {class: 'card'}, open.map(r => rideRow(r, now))));
  if (shut.length) out.push(h('h2', null, 'Not running'), h('div', {class: 'card'}, shut.map(r => rideRow(r, now))));
  if (done.length) out.push(h('details', {open: doneOpen, ontoggle: e => { doneOpen = e.target.open; }},
    h('summary', null, h('h2', null, `Done today (${done.length})`)),
    h('div', {class: 'card'}, done.map(r => h('div', {class: 'row off done'}, check(r, true), h('div', {class: 'main'}, nameEl(r)))))));
  $('#now').replaceChildren(...out);
}

function renderPick() {
  const q = $('#q').value.trim().toLowerCase(), out = [];
  if (!live.length) return $('#picklist').replaceChildren(h('div', {class: 'note'}, failed ? `Couldn't load the ride list. Tap ↻.` : 'Loading rides…'));
  const inPark = a => park === 'all' || a.parkId === park;
  const setSel = () => { store.set('sel', [...sel]); render(); };
  out.push(h('div', {class: 'picktools'},
    btn('＋ Add the headliners', () => { for (const a of live) if (inPark(a) && HEADLINERS.some(n => a.name.includes(n))) sel.add(a.id); setSel(); }, 'small'),
    sel.size > 0 && btn('Clear all', () => { if (confirm('Clear all your picks?')) { sel.clear(); setSel(); } }, 'small')));
  for (const [id, n] of Object.entries(PARKS)) {
    const list = live.filter(a => a.parkId === id && inPark(a) && a.name.toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
    if (!list.length) continue;
    out.push(h('h2', null, n[0]), h('div', {class: 'card'}, list.map(a => {
      const on = sel.has(a.id);
      const w = a.status === 'OPERATING' ? (a.queue?.STANDBY?.waitTime != null ? a.queue.STANDBY.waitTime + ' min' : 'Open') : (OFF[a.status] || a.status);
      return h('button', {class: 'row pickrow' + (on ? ' sel' : ''), role: 'checkbox', 'aria-checked': String(on),
        onclick: () => { on ? sel.delete(a.id) : sel.add(a.id); setSel(); }},
        h('span', {class: 'chk' + (on ? ' on' : '')}, h('i', null, '✓')), h('span', {class: 'main name'}, a.name), h('small', null, w));
    })));
  }
  if (out.length === 1) out.push(h('div', {class: 'note'}, 'No rides match.'));
  $('#picklist').replaceChildren(...out);
}

function head() {
  $('#t-pick-label').textContent = `My rides (${sel.size})`;
  $('#t-now').setAttribute('aria-selected', tab === 'now');
  $('#t-pick').setAttribute('aria-selected', tab === 'pick');
  $('#t-map').setAttribute('aria-selected', tab === 'map');
  $('#refresh').textContent = loading ? '↻ …' : fetchedAt ? '↻ ' + clock(fetchedAt) : '↻';
  $('#geo').textContent = {off: '📍 Off', wait: '📍 Finding…', on: atPark() ? '📍 On' : '📍 Not in park', denied: '📍 Blocked', error: '📍 Retry'}[geoState];
  $('#seg').replaceChildren(...[['all', 'Both parks'], ...Object.entries(PARKS).map(([id, n]) => [id, n[0]])].map(([id, n]) =>
    h('button', {'aria-pressed': String(park === id), onclick: () => { park = id; fitted = false; store.set('park', id); render(); }}, n)));
}
function render() {
  freshDay(); head();
  $('#now').hidden = tab !== 'now'; $('#pick').hidden = tab !== 'pick'; $('#map').hidden = tab !== 'map';
  $('main').classList.toggle('mapmode', tab === 'map');
  tab === 'now' ? renderNow() : tab === 'pick' ? renderPick() : renderMap();
}
$('#t-map').onclick = () => { tab = 'map'; render(); scrollTo(0, 0); };

$('#t-now').onclick = () => { tab = 'now'; render(); scrollTo(0, 0); };
$('#t-pick').onclick = () => { tab = 'pick'; render(); scrollTo(0, 0); };
$('#refresh').onclick = load;
$('#geo').onclick = () => { if (geoState !== 'on' && geoState !== 'wait') startGeo(); };
$('#q').oninput = renderPick;
setInterval(() => { if (!document.hidden) load(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - fetchedAt > 30000) load(); });

// ?at=lat,lng fakes a position for testing walk times away from the park.
const fake = new URLSearchParams(location.search).get('at');
if (fake) { const [lat, lng] = fake.split(',').map(Number); pos = {lat, lng}; geoState = 'on'; }
else if (store.get('geo', 0)) startGeo();

// ?selftest: the one check that fails if the ranking logic breaks.
if (location.search.includes('selftest')) {
  const ok = score(20, 0, 60) < score(15, 0, 20) && score(20, 10, 40) > score(20, 0, 40) && score(null, 0, 30) === Infinity
    && label(5, 30)[0] === 'Walk-on' && label(30, 60)[0] === 'Great time' && label(60, 40)[0] === 'Very busy' && label(40, 40)[0] === 'Typical'
    && walkMin({lat: 33.81, lng: -117.919}, {lat: 33.811, lng: -117.919}) === 2;
  document.title = ok ? 'selftest ok' : 'selftest FAILED';
}
render(); load();
</script>
</body>
</html>
